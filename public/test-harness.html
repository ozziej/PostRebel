<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostRebel - Test Harness (mocked electronAPI)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; color: #ffffff; overflow: hidden; }
        #root { height: 100vh; display: flex; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
      // TEMPORARY verification harness — mocks window.electronAPI. Delete this file when done.
      const nowIso = new Date().toISOString();
      const workspace = { id: 'ws1', name: 'Test Workspace', description: '', path: '/tmp/ws1', createdAt: nowIso, updatedAt: nowIso };
      const collection = {
        id: 'c1',
        name: 'Demo Collection',
        requests: [
          { id: 'r0', name: 'Top-level Health Check', method: 'GET', url: 'https://api.example.com/health', headers: {} },
        ],
        folders: [
          {
            id: 'fUsers',
            name: 'Users',
            requests: [
              { id: 'r1', name: 'List Users', method: 'GET', url: 'https://api.example.com/users', headers: {} },
            ],
            folders: [
              {
                id: 'fAdmin',
                name: 'Admin',
                requests: [
                  { id: 'r2', name: 'Ban User', method: 'POST', url: 'https://api.example.com/users/ban', headers: {} },
                ],
                folders: [
                  {
                    id: 'fSuper',
                    name: 'Super Admin',
                    requests: [
                      { id: 'r3', name: 'Delete Everything', method: 'DELETE', url: 'https://api.example.com/nuke', headers: {} },
                    ],
                  },
                ],
              },
            ],
          },
          {
            id: 'fBilling',
            name: 'Billing',
            requests: [
              { id: 'r4', name: 'List Invoices', method: 'GET', url: 'https://api.example.com/invoices', headers: {} },
            ],
          },
        ],
      };
      const environment = { id: 'e1', name: 'Development', variables: {}, variablesArray: [] };

      const ok = (extra) => Promise.resolve(Object.assign({ success: true }, extra));

      window.electronAPI = {
        getSettings: () => ok({ settings: {} }),
        updateSettings: () => ok({}),
        savePreference: () => ok({}),
        chooseWorkspaceDirectory: () => ok({}),
        createWorkspace: () => ok({ workspace }),
        loadWorkspaces: () => ok({ workspaces: [workspace] }),
        setActiveWorkspace: () => ok({}),
        updateWorkspace: () => ok({ workspace }),
        deleteWorkspace: () => ok({}),
        exportWorkspace: () => ok({ data: '{}' }),
        importWorkspace: () => ok({ workspace }),
        saveCollection: (workspaceId, data) => { console.log('[mock] saveCollection', JSON.stringify(data)); return ok({}); },
        loadCollections: () => ok({ collections: [collection] }),
        deleteCollection: () => ok({}),
        saveEnvironment: () => ok({}),
        loadEnvironments: () => ok({ environments: [environment] }),
        saveCertificate: () => ok({}),
        loadCertificates: () => ok({ certificates: [] }),
        deleteCertificate: () => ok({}),
        loadCertificateFile: () => ok({}),
        executeHttpRequest: () => ok({ response: { status: 200, statusText: 'OK', headers: {}, data: {}, time: 1, size: 1 } }),
        gitInit: () => ok({}),
        gitStatus: () => ok({}),
        selectJsonFile: () => ok({ content: '{}' }),
        selectBinaryFile: () => ok({}),
        loadHistory: () => ok({ entries: [] }),
        saveHistoryEntry: () => ok({}),
        truncateHistory: () => ok({}),
        loadSavedResponses: () => ok({ entries: [] }),
        saveSavedResponse: () => ok({}),
        deleteSavedResponse: () => ok({}),
        renameSavedResponse: () => ok({}),
        loadRunners: () => ok({ runners: [] }),
        saveRunner: () => ok({}),
        deleteRunner: () => ok({}),
        loadRunnerHistory: () => ok({ entries: [] }),
        saveRunnerHistory: () => ok({}),
      };
    </script>
    <script src="/bundle.js"></script>
</body>
</html>
